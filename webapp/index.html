<meta charset="utf-8">
<title>Huquqiy Navigator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Maket: telefon ustuni (≤520px), pastda suzuvchi shisha dock. Ikki mavzu: yorug' (bare :root) va qorong'i.
   Unumdorlik: backdrop-filter faqat dock va sheet'da; animatsiyalar faqat transform/opacity (kompozitor). */
:root {
  --bg: #eceef7; --bg-2: #ffffff;
  --ink: #15132c; --ink-2: #4a4770; --ink-3: #8783a6;
  --surface: rgba(255, 255, 255, .66); --surface-2: rgba(255, 255, 255, .86); --edge: rgba(21, 19, 44, .09);
  --hi: rgba(255, 255, 255, .95); --shadow: rgba(52, 38, 120, .16); --scrim: rgba(20, 16, 40, .32);
  --violet: #6b4bff; --cyan: #0a9fc2; --gold: #d38f12; --good: #0e9a6a; --warn: #b77d00; --bad: #e0244c;
  --ask-bg: #ffffff; --aur-1: rgba(107, 75, 255, .20); --aur-2: rgba(10, 159, 194, .14); --aur-3: rgba(211, 143, 18, .10);
  --font-display: 'Unbounded', 'Manrope', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r: 22px; --dock-h: 74px;
  --spring: cubic-bezier(.22, 1, .36, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07070d; --bg-2: #0f0e1a; --ink: #f3f1ff; --ink-2: #aca8c8; --ink-3: #6f6b8e;
  --surface: rgba(255, 255, 255, .055); --surface-2: rgba(255, 255, 255, .09); --edge: rgba(255, 255, 255, .11);
  --hi: rgba(255, 255, 255, .16); --shadow: rgba(0, 0, 0, .55); --scrim: rgba(3, 2, 10, .6);
  --violet: #8b5cf6; --cyan: #22d3ee; --gold: #f5b83d; --good: #34d399; --warn: #fbbf24; --bad: #fb7185;
  --ask-bg: #0b0a14; --aur-1: rgba(139, 92, 246, .26); --aur-2: rgba(34, 211, 238, .14); --aur-3: rgba(245, 184, 61, .09);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07070d; --bg-2: #0f0e1a; --ink: #f3f1ff; --ink-2: #aca8c8; --ink-3: #6f6b8e;
  --surface: rgba(255, 255, 255, .055); --surface-2: rgba(255, 255, 255, .09); --edge: rgba(255, 255, 255, .11);
  --hi: rgba(255, 255, 255, .16); --shadow: rgba(0, 0, 0, .55); --scrim: rgba(3, 2, 10, .6);
  --violet: #8b5cf6; --cyan: #22d3ee; --gold: #f5b83d; --good: #34d399; --warn: #fbbf24; --bad: #fb7185;
  --ask-bg: #0b0a14; --aur-1: rgba(139, 92, 246, .26); --aur-2: rgba(34, 211, 238, .14); --aur-3: rgba(245, 184, 61, .09);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent; transition: background-color .35s var(--spring); }
/* Fon "aurora": oldindan yumshoq gradientlar, filter: blur ishlatilmaydi (qotmaslik uchun) */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(60% 38% at 18% 8%, var(--aur-1), transparent 70%),
              radial-gradient(50% 34% at 88% 4%, var(--aur-2), transparent 70%),
              radial-gradient(45% 30% at 60% 34%, var(--aur-3), transparent 75%); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--dock-h) + 40px + env(safe-area-inset-bottom, 0px)); }
.screen { display: grid; gap: 14px; animation: enter .5s var(--spring) both; }
@keyframes enter { from { opacity: 0; transform: translate3d(0, 12px, 0); } }

/* Suyuq shisha karta: yaltiroq qatlam fon qatlami sifatida (matn ustiga tushmaydi) */
.glass { position: relative; border-radius: var(--r); border: 1px solid var(--edge);
  background: linear-gradient(180deg, var(--hi), transparent 38%) top / 100% 100% no-repeat, var(--surface);
  box-shadow: inset 0 1px 0 var(--hi), 0 14px 34px -20px var(--shadow); }
.press { transition: transform .25s var(--spring), background-color .2s; }
.press:active { transform: scale(.97); }

/* Sarlavha */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none;
  background: linear-gradient(135deg, var(--violet), var(--cyan)); box-shadow: 0 6px 16px -6px var(--violet); }
.logo svg.i { width: 20px; height: 20px; stroke-width: 2; }
.brand h1 { margin: 0; font: 700 15px/1.2 var(--font-display); letter-spacing: .01em; }
.brand small { display: block; color: var(--ink-3); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.demo { color: var(--gold); background: color-mix(in srgb, var(--gold) 13%, transparent); }
.pill.live { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }

/* 3D shar */
.hero { display: grid; place-items: center; height: 264px; touch-action: pan-y; }
#orb { width: 264px; height: 264px; max-width: 100%; display: block; cursor: grab; }
.orb-fallback { width: 168px; height: 168px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.75), transparent 28%), conic-gradient(var(--violet), var(--cyan), var(--gold), var(--violet)); }
.lead { text-align: center; display: grid; gap: 6px; }
.lead h2 { margin: 0; font: 700 clamp(19px, 5.6vw, 25px)/1.22 var(--font-display); text-wrap: balance; }
.lead p { margin: 0 auto; max-width: 40ch; color: var(--ink-2); font-size: 14px; text-wrap: balance; }

/* Neon qidiruv maydoni: aylanadigan qatlam transform bilan (GPU), qayta chizilmaydi */
.ask-wrap { position: relative; }
.ask-glow { position: absolute; inset: 6px; border-radius: 26px; overflow: hidden; filter: blur(16px); opacity: .55; pointer-events: none; }
.ask { position: relative; border-radius: 24px; padding: 1.6px; overflow: hidden; isolation: isolate; }
.ring { position: absolute; left: 50%; top: 50%; width: 220%; aspect-ratio: 1; translate: -50% -50%; z-index: -1;
  background: conic-gradient(var(--gold), var(--violet) 25%, var(--cyan) 50%, var(--violet) 75%, var(--gold));
  animation: rot 5s linear infinite; will-change: transform; }
.ask-glow .ring { width: 230%; animation: none; } /* xira qatlam qimirlamaydi: har kadrda blur qayta hisoblanmasin */
.busy .ring { animation-duration: 1.4s; }
@keyframes rot { to { transform: rotate(1turn); } }
.ask-inner { position: relative; background: var(--ask-bg); border-radius: 22.5px; padding: 14px 14px 10px; display: grid; gap: 10px; }
.field { position: relative; }
.field textarea { width: 100%; min-height: 78px; max-height: 220px; resize: none; display: block; background: transparent; border: 0; outline: 0;
  color: var(--ink); font: 500 15.5px/1.5 var(--font-body); padding: 0; }
.typed { position: absolute; inset: 0 0 auto; pointer-events: none; color: var(--ink-3); font: 500 15.5px/1.5 var(--font-body); }
.caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; vertical-align: -2px; background: var(--cyan); animation: blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ask-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: var(--surface-2); border: 1px solid var(--edge); color: var(--ink-2); white-space: nowrap; }
.chip svg.i { width: 16px; height: 16px; }
.file-tag { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--cyan); }
.send { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none;
  background: linear-gradient(135deg, var(--violet), var(--cyan)); box-shadow: 0 8px 20px -8px var(--violet); transition: transform .25s var(--spring), opacity .2s; }
.send:disabled { opacity: .35; box-shadow: none; cursor: default; }
.send:not(:disabled):active { transform: scale(.92); }

.label { color: var(--ink-3); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
.quick { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; margin: 0 -2px; scroll-snap-type: x proximity; }
.quick::-webkit-scrollbar { display: none; }
.quick .chip { scroll-snap-align: start; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 14px 10px; text-align: center; }
.stat b { display: block; font: 700 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-3); font-size: 11.5px; }

/* Tahlil bosqichlari */
.steps { padding: 18px; display: grid; gap: 14px; }
.step { display: flex; align-items: center; gap: 12px; color: var(--ink-3); transition: color .3s; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1.5px solid var(--edge);
  font: 700 12px var(--font-mono); transition: background-color .3s, border-color .3s; }
.dot svg.i { width: 15px; height: 15px; stroke-width: 2.4; }
.step.on { color: var(--ink); }
.step.on .dot { border-color: var(--cyan); animation: halo 1.2s ease-in-out infinite; }
.step.done { color: var(--ink-2); }
.step.done .dot { background: color-mix(in srgb, var(--good) 16%, transparent); border-color: var(--good); color: var(--good); animation: none; }
@keyframes halo { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--cyan) 35%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
.bar { height: 4px; border-radius: 4px; background: var(--edge); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: transform .6s var(--spring); }

/* Natija */
.head { padding: 16px 18px; display: grid; gap: 10px; }
.badge { justify-self: start; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 999px; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.lv-oddiy { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.lv-muhim { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.lv-jiddiy, .lv-xavf { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.head p { margin: 0; font-size: 15.5px; }
.sos { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; font-weight: 700; color: var(--bad);
  background: color-mix(in srgb, var(--bad) 11%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.sec { padding: 16px 18px; display: grid; gap: 10px; }
.sec h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.sec h3 svg.i { width: 17px; height: 17px; color: var(--violet); }
.sec ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; }
.sec li::marker { color: var(--violet); }
.route { display: grid; gap: 3px; padding: 11px 13px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--edge); }
.route b { font-size: 14.5px; }
.route span { color: var(--ink-2); font-size: 13px; }
.law { display: grid; gap: 3px; padding: 11px 13px; border-radius: 14px; text-decoration: none; color: var(--ink);
  background: color-mix(in srgb, var(--violet) 8%, transparent); border: 1px solid color-mix(in srgb, var(--violet) 26%, transparent); }
.law b { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 500 12.5px var(--font-mono); color: var(--violet); }
.law b svg.i { width: 15px; height: 15px; }
.law span { color: var(--ink-2); font-size: 13px; }
.note { margin: 0; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
.actions { display: grid; gap: 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 15px; }
.btn.primary { color: #fff; background: linear-gradient(135deg, var(--violet), var(--cyan)); box-shadow: 0 10px 24px -12px var(--violet); }
.btn.danger { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 38%, transparent); }
.btn.ghost { background: var(--surface); border: 1px solid var(--edge); }
.btn:disabled { opacity: .45; }
pre.doc { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.6 var(--font-mono); color: var(--ink); padding: 16px; max-height: 52vh; overflow: auto; }

/* 3 kalit */
.keys { padding: 18px; display: grid; gap: 16px; }
.key { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.key .k { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); border: 1.5px solid var(--edge); color: var(--ink-2); }
.key.ok .k { color: var(--good); border-color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
.key.wait .k { color: var(--gold); border-color: var(--gold); }
.key b { display: block; font-size: 14.5px; }
.key span { color: var(--ink-2); font-size: 12.5px; }
.state { font-size: 12px; font-weight: 800; color: var(--ink-3); }
.key.ok .state { color: var(--good); } .key.wait .state { color: var(--gold); }

/* Ro'yxatlar */
.list { display: grid; gap: 10px; }
.item { padding: 14px 16px; display: grid; gap: 6px; text-align: left; width: 100%; text-decoration: none; color: inherit; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.row b { font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item span { color: var(--ink-2); font-size: 13px; }
.mono { font: 500 12px var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--edge); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--bg-2); color: var(--ink); box-shadow: 0 2px 8px -4px var(--shadow); }
.seg svg.i { width: 16px; height: 16px; }

/* Pastki sheet — prujina fizikasi bilan, pastga tortib yopiladi */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity .3s; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; width: min(520px, 100%); touch-action: none;
  padding: 10px max(18px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  border-radius: 28px 28px 0 0; display: grid; gap: 14px; border: 1px solid var(--edge); border-bottom: 0;
  background: color-mix(in srgb, var(--bg-2) 84%, transparent); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  box-shadow: 0 -20px 50px -20px var(--shadow); will-change: transform; transform: translate3d(0, 100%, 0); }
.grabber { justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--edge); margin-bottom: 2px; }
.sheet h3 { margin: 0; font: 700 17px/1.3 var(--font-display); }
.sheet p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.role { padding: 14px; border-radius: 18px; text-align: left; background: var(--surface-2); border: 1px solid var(--edge); display: grid; gap: 4px; }
.role:last-child { grid-column: 1 / -1; }
.role svg.i { width: 24px; height: 24px; color: var(--violet); }
.role b { font-size: 14px; }
.role span { color: var(--ink-3); font-size: 11.5px; }

/* Suzuvchi dock (iOS uslubi) */
.dock { position: fixed; z-index: 30; left: 0; right: 0; margin: 0 auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(300px, calc(100% - 32px)); height: var(--dock-h); display: grid; grid-template-columns: 1fr 76px 1fr; align-items: center;
  padding: 0 8px; border-radius: 28px; border: 1px solid var(--edge);
  background: color-mix(in srgb, var(--bg-2) 72%, transparent); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  box-shadow: inset 0 1px 0 var(--hi), 0 16px 36px -18px var(--shadow); }
.tab { position: relative; display: grid; justify-items: center; gap: 3px; padding: 7px 0; border-radius: 18px; color: var(--ink-3);
  font-size: 10.5px; font-weight: 800; transition: color .25s; }
.tab svg.i { width: 22px; height: 22px; }
.tab.active { color: var(--ink); }
.tab::after { content: ""; position: absolute; bottom: 1px; width: 5px; height: 5px; border-radius: 50%; background: var(--violet);
  transform: scale(0); transition: transform .35s var(--spring); }
.tab.active::after { transform: scale(1); }
.fab { justify-self: center; width: 60px; height: 60px; margin-top: -30px; border-radius: 50%; position: relative; overflow: hidden;
  box-shadow: 0 10px 26px -8px var(--violet); transition: transform .3s var(--spring); }
.fab:active { transform: scale(.92); }
.fab .ring { width: 180%; animation-duration: 7s; }
.fab span { position: absolute; inset: 3px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; color: var(--ink); }
.fab svg.i { width: 26px; height: 26px; stroke-width: 2.2; }

.toast { position: fixed; z-index: 50; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px);
  bottom: calc(var(--dock-h) + 30px + env(safe-area-inset-bottom, 0px)); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
  color: var(--bg); background: var(--ink); animation: enter .35s var(--spring); }


/* ---------- Navigator ---------- */
.screen.center { text-align: center; justify-items: center; }
.screen.center .btn, .screen.center .two { width: 100%; }
.eyebrow { margin: 0; color: var(--violet); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.lead.left { text-align: left; }
.lead.left p { margin: 0; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 22px; height: 4px; border-radius: 4px; background: var(--edge); transition: background-color .3s; }
.dots i.on { background: var(--violet); }
.opts { display: grid; gap: 10px; }
.opt { padding: 15px 16px; border-radius: 16px; text-align: left; font-weight: 700; font-size: 15px; background: var(--surface-2); border: 1px solid var(--edge); }
.opt:hover { border-color: var(--violet); }
.inline-in { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 18px; }
.field-in { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 500 15px/1.5 var(--font-body); resize: none; width: 100%; }
.field-in::placeholder { color: var(--ink-3); }
.link { justify-self: center; color: var(--ink-3); font-size: 13.5px; font-weight: 700; padding: 6px 10px; text-decoration: underline; text-underline-offset: 3px; }
.hero-ic { justify-self: center; width: 76px; height: 76px; border-radius: 26px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--violet), var(--cyan)); box-shadow: 0 14px 30px -12px var(--violet); }
.hero-ic svg.i { width: 36px; height: 36px; stroke-width: 2; }
.hero-ic.good { background: linear-gradient(135deg, var(--good), var(--cyan)); }
.route-card { display: grid; grid-template-columns: 34px minmax(0, 1fr) 18px; gap: 12px; align-items: center; padding: 15px; text-align: left; width: 100%; }
.route-card .num { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font: 700 14px var(--font-display);
  background: color-mix(in srgb, var(--violet) 14%, transparent); color: var(--violet); }
.rc-body { display: grid; gap: 3px; min-width: 0; }
.rc-body b { font-size: 15px; }

// Lugʻat va server javoblari amaldagi lotinda; koʻrsatishda tanlangan yozuvga oʻgiriladi (bot/script.py bilan bir xil qoida).
const APO = "ʻʼ'‘’`";
const SKIP_RE = /(<[^>]*>|&#?\w+;|https?:\/\/\S+|\b[\w.+-]+@[\w-]+\.[\w.]+|\b[\w-]+(?:\.[\w-]+)*\.(?:uz|com|ru|org|net|me)\b|\{[^}]*\}|\b(?:PDF|AI|Telegram|Yandex|Groq|Gemini|lex)\b)/g;
const CYR1 = { a: 'а', b: 'б', d: 'д', e: 'е', f: 'ф', g: 'г', h: 'ҳ', i: 'и', j: 'ж', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', q: 'қ',
  r: 'р', s: 'с', t: 'т', u: 'у', v: 'в', x: 'х', y: 'й', z: 'з', c: 'к', w: 'в' };
const CYR2 = { sh: 'ш', ch: 'ч', yo: 'ё', yu: 'ю', ya: 'я', ye: 'е' };
const VOW = /[aeiouAEIOUоаеиуўэёюяОАЕИУЎЭЁЮЯ]/;
const ISL = /\p{L}/u;
const TOK = new RegExp(`([oOgG][${APO}])|(sh|Sh|SH|ch|Ch|CH|(?:yo|Yo|YO)(?![${APO}])|yu|Yu|YU|ya|Ya|YA|ye|Ye|YE)|([${APO}])|([A-Za-z])`, 'g');
const up = (c, big) => big ? c.toUpperCase() : c;
function cyrlSeg(s) {
  let out = '', pos = 0;
  for (const m of s.matchAll(TOK)) {
    out += s.slice(pos, m.index); pos = m.index + m[0].length;
    const prev = out.slice(-1), [, og, di, apo, ch] = m;
    if (og) out += up(og[0].toLowerCase() === 'o' ? 'ў' : 'ғ', og[0] !== og[0].toLowerCase());
    else if (di) out += up(CYR2[di.toLowerCase()], di[0] !== di[0].toLowerCase());
    else if (apo) out += (ISL.test(prev) && ISL.test(s[pos] || '')) ? 'ъ' : apo;
    else { const lo = ch.toLowerCase(); out += up(lo === 'e' && (!ISL.test(prev) || VOW.test(prev)) ? 'э' : CYR1[lo], ch !== lo); }
  }
  return out + s.slice(pos);
}
const NEWL = [[new RegExp(`O[${APO}]`, 'g'), 'Ö'], [new RegExp(`o[${APO}]`, 'g'), 'ö'], [new RegExp(`G[${APO}]`, 'g'), 'Ğ'], [new RegExp(`g[${APO}]`, 'g'), 'ğ'],
  [/SH|Sh/g, 'Ş'], [/sh/g, 'ş'], [/CH|Ch/g, 'Ç'], [/ch/g, 'ç']];
const latnSeg = s => NEWL.reduce((a, [rx, r]) => a.replace(rx, r), s);

  if (LANG !== 'uz' || typeof text !== 'string' || !text) return text;
  const fn = SCRIPT === 'latn' ? latnSeg : cyrlSeg;
  let out = '', pos = 0;
  for (const m of text.matchAll(SKIP_RE)) { out += fn(text.slice(pos, m.index)) + m[0]; pos = m.index + m[0].length; }
  return out + fn(text.slice(pos));
}

// m·x'' = −k(x − x₀) − c·x',  c = 2ζ√(km). ζ < 1 — yengil tebranish, ζ = 1 — kritik so'nish.
function spring({ from, to, v = 0, k = 420, zeta = 0.86, onStep, onDone }) {
  if (REDUCED) { onStep(to); onDone && onDone(); return () => {}; }
  const c = 2 * zeta * Math.sqrt(k), DT = 1 / 240;
  let x = from, vel = v, acc = 0, last = performance.now(), raf;
  const tick = now => {
    acc += Math.min(0.25, (now - last) / 1000); last = now; // sekin qurilmada ham animatsiya oʻz vaqtida tugaydi
    while (acc >= DT) { const a = -k * (x - to) - c * vel; vel += a * DT; x += vel * DT; acc -= DT; }
    onStep(x);
    if (Math.abs(x - to) < 0.3 && Math.abs(vel) < 2) { onStep(to); onDone && onDone(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

let typeRaf;
function typewriter(node, active) {
  cancelAnimationFrame(typeRaf);
  let p = 0, i = 0, del = false, next = 0;
  const step = now => {
    if (!node.isConnected) return;
    if (now >= next && active()) {
      const P = L('prompts'), s = conv(P[p % P.length]);
      i += del ? -1 : 1; node.textContent = s.slice(0, i);
      if (!del && i >= s.length) { del = true; next = now + 1700; }
      else if (del && i <= 0) { del = false; p = (p + 1) % L('prompts').length; next = now + 350; }
      else next = now + (del ? 16 : 38 + Math.random() * 30);
    }
    typeRaf = requestAnimationFrame(step);
  };
  typeRaf = requestAnimationFrame(step);
}

async function analyze() {

  try {

async function navStart() {
  go('analyzing');
  const timer = progressSteps(2);
  try {
    const body = { text: state.text, role: state.role, lang: LANG };
    if (state.file) Object.assign(body, { file: await toBase64(state.file), file_name: state.file.name, file_type: state.file.type });
    const d = await api('/nav/start', body);
    clearInterval(timer);
    Object.assign(nav, { caseId: d.case_id, questions: d.questions || [], qi: 0, answers: [], district: '', lat: null, lon: null, st: null });
    state.text = ''; state.file = null;
    const next = nav.questions.length ? 'clarify' : 'district';
    const seen = state.sosSeen; state.sosSeen = false;
    if (d.danger && !seen) {
      go('home');
      Sheet(close => [el('div', { class: 'grabber' }), el('h3', { text: L('dangerTitle') }),
        el('div', { class: 'sos' }, ic('phone'), el('span', { text: L('dangerText') })),
        el('button', { class: 'btn danger press', onclick: () => close(() => go(next)) }, L('dangerBtn'))]);
    } else go(next);
  } catch (e) {
    clearInterval(timer); go('home');
    if (e.status === 403 && e.data && e.data.need_consent) askConsent(navStart);
    else toast(e.status && e.message ? e.message : L('errAnalyze'));
  }
}
// "Tahlil" ekranidagi bosqichlarni koʻrsatish (haqiqiy vaqtga yaqin)
function progressSteps(upto) {
  const nodes = [...document.querySelectorAll('.step')], bar = $('#bar');
  let k = 0;
  const mark = () => { nodes.forEach((n, j) => { n.className = 'step' + (j < k ? ' done' : j === k ? ' on' : '');
    n.firstChild.replaceChildren(j < k ? ic('check') : document.createTextNode(j + 1)); }); if (bar) bar.style.transform = `scaleX(${Math.min(1, k / nodes.length)})`; };
  mark();
  return setInterval(() => { if (k < Math.min(upto, nodes.length - 1)) { k++; mark(); } }, 900);
}

function getLocation() {
  const done = (lat, lon) => { nav.lat = lat; nav.lon = lon; haptic(); navNavigate(); };
  const fail = () => toast(L('locErr'));
  try {
    const lm = TG && TG.LocationManager;
    if (lm && lm.init) { lm.init(() => { if (lm.isLocationAvailable) lm.getLocation(loc => loc ? done(loc.latitude, loc.longitude) : fail()); else geo(); }); return; }
  } catch (e) {}
  geo();
  function geo() { if (!navigator.geolocation) return fail(); navigator.geolocation.getCurrentPosition(p => done(p.coords.latitude, p.coords.longitude), fail, { timeout: 8000 }); }
}

// ===================== Ovozli xabar (mikrofon → WAV 16 kHz mono → serverda matnga) =====================
const rec = { on: false, stream: null, ctx: null, proc: null, chunks: [], rate: 48000, t0: 0, timer: null };
async function toggleRec() {
  if (rec.on) return stopRec(true);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast(L('micNo'));
  try { rec.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { return toast(L('micDenied')); }
  const AC = window.AudioContext || window.webkitAudioContext;
  rec.ctx = new AC(); rec.rate = rec.ctx.sampleRate; rec.chunks = [];
  const src = rec.ctx.createMediaStreamSource(rec.stream);
  rec.proc = rec.ctx.createScriptProcessor(4096, 1, 1);
  rec.proc.onaudioprocess = e => rec.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(rec.proc); rec.proc.connect(rec.ctx.destination);
  rec.on = true; rec.t0 = Date.now(); haptic('medium');
  const b = $('#mic'); if (b) { b.classList.add('on'); b.replaceChildren(ic('stop'), el('span', { class: 'mono', id: 'mic-t', text: '0:00' })); b.setAttribute('aria-label', L('micStop')); }
  rec.timer = setInterval(() => { const sec = Math.floor((Date.now() - rec.t0) / 1000), t = $('#mic-t');
    if (t) t.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; if (sec >= 120) stopRec(true); }, 250);
}
function stopRec(send) {
  clearInterval(rec.timer); rec.on = false;
  try { rec.proc.disconnect(); rec.stream.getTracks().forEach(t => t.stop()); rec.ctx.close(); } catch (e) {}
  const b = $('#mic'); if (b) { b.classList.remove('on'); b.replaceChildren(ic('mic')); b.setAttribute('aria-label', L('micRec')); }
  const n = rec.chunks.reduce((a, c) => a + c.length, 0);
  if (!send) return;
  if (n < rec.rate * 0.8) return toast(L('micShort'));
  const pcm = new Float32Array(n); let o = 0; for (const c of rec.chunks) { pcm.set(c, o); o += c.length; }
  rec.chunks = [];
  state.file = new File([wav16k(pcm, rec.rate)], 'ovoz.wav', { type: 'audio/wav' });
  haptic('heavy'); submit();
}
// Pastga diskretlash (oʻrtacha qiymat) + 16-bit PCM WAV sarlavhasi
function wav16k(x, inRate) {
  const R = 16000, k = inRate / R, len = Math.floor(x.length / k), buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, R, true); v.setUint32(28, R * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, len * 2, true);
  for (let i = 0; i < len; i++) {
    let s = 0, a = Math.floor(i * k), b2 = Math.min(x.length, Math.floor((i + 1) * k)); for (let j = a; j < b2; j++) s += x[j];
    const y = Math.max(-1, Math.min(1, s / Math.max(1, b2 - a))); v.setInt16(44 + i * 2, y < 0 ? y * 0x8000 : y * 0x7fff, true);
  }
  return buf;
}

// ===================== Sheet: prujina + tortib yopish =====================
let sheetOpen = null;
function Sheet(build) {
  if (sheetOpen) sheetOpen.close();
  const scrim = el('div', { class: 'scrim' });
  const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' });
  let y = 0, h = 0, stop = () => {}, closing = false;
  const set = v => { y = v; sheet.style.transform = `translate3d(0, ${v}px, 0)`; scrim.style.opacity = String(Math.max(0, 1 - v / h)); };
  const close = after => {
    if (closing) return; closing = true; stop();
    let done = false;
    const finish = () => { if (done) return; done = true; stop(); scrim.remove(); sheet.remove(); sheetOpen = null; after && after(); };
    stop = spring({ from: y, to: h + 40, k: 520, zeta: 1, onStep: set, onDone: finish });
    setTimeout(finish, 450); // zaxira: kadrlar sekinlashsa ham keyingi qadam kechikmaydi
  };
  sheet.append(...build(close));
  scrim.addEventListener('click', () => close());
  $('#layer').append(scrim, sheet);
  h = sheet.getBoundingClientRect().height; set(h);
  stop = spring({ from: h, to: 0, k: 380, zeta: 0.82, onStep: set });
  // Tortish: tezlik so'nggi 80 ms dagi siljishdan hisoblanadi (px/s); |v| > 900 yoki 35% dan ko'p — yopiladi
  let startY = 0, startT = 0, samples = [];
  sheet.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    stop(); startY = e.clientY - y; samples = [[e.timeStamp, e.clientY]]; sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove', e => {
    if (!sheet.hasPointerCapture(e.pointerId)) return;
    const d = e.clientY - startY; set(d < 0 ? d * 0.25 : d); // yuqoriga — qarshilik (rubber-band)
    samples.push([e.timeStamp, e.clientY]); while (samples.length > 2 && e.timeStamp - samples[0][0] > 80) samples.shift();
  });
  sheet.addEventListener('pointerup', e => {
    if (!sheet.hasPointerCapture(e.pointerId)) return;
    const [t0, y0] = samples[0], v = (e.clientY - y0) / Math.max(1, e.timeStamp - t0) * 1000;
    if (y > h * 0.35 || v > 900) close(); else stop = spring({ from: y, to: 0, v, k: 380, zeta: 0.82, onStep: set });
  });
  sheetOpen = { close };
  haptic();
}

// ===================== 3D suyuq shar (GPU shader) =====================
// Vertex shader sirtni tovlanadi: r = 1 + A·f(n, t). Normal chekli ayirmalar bilan (ε = 0.01) qayta hisoblanadi.
// Fragment: Schlick Fresnel F = F0 + (1 − F0)(1 − n·v)^5, F0 = 0.04; iridessensiya — kosinus palitra; Blinn-Phong yaltirash.
const VERT = `
uniform float uTime; uniform float uAmp; varying vec3 vN; varying vec3 vV; varying float vF;
float f(vec3 p){ return 0.55*sin(p.x*3.1+uTime*1.6) + 0.45*sin(p.y*3.7+uTime*1.25) + 0.35*sin(p.z*4.3+uTime*1.9) + 0.30*sin((p.x+p.y+p.z)*2.3-uTime*1.1); }
vec3 disp(vec3 n){ return n*(1.0+uAmp*f(n)); }
void main(){
  vec3 n = normalize(position);
  vec3 t = normalize(cross(n, abs(n.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0)));
  vec3 b = cross(n, t);
  vec3 p0 = disp(n), p1 = disp(normalize(n + t*0.01)), p2 = disp(normalize(n + b*0.01));
  vec3 nn = normalize(cross(p1 - p0, p2 - p0)); if (dot(nn, n) < 0.0) nn = -nn;
  vF = f(n);
  vec4 mv = modelViewMatrix * vec4(p0 * 1.32, 1.0);
  vN = normalize(normalMatrix * nn); vV = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv;
}`;
const FRAG = `
uniform vec3 cA; uniform vec3 cB; uniform vec3 cC; uniform float uLight; varying vec3 vN; varying vec3 vV; varying float vF;
void main(){
  float ndv = clamp(dot(vN, vV), 0.0, 1.0);
  float F = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
  float h = 1.0 - ndv + vF * 0.08;
  vec3 iri = 0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + h * 0.85 + 0.55));
  vec3 base = mix(cA, cB, smoothstep(0.0, 1.0, h));
  vec3 L = normalize(vec3(-0.45, 0.75, 0.55)); vec3 H = normalize(L + vV);
  float spec = pow(max(dot(vN, H), 0.0), 72.0);
  float diff = 0.62 + 0.38 * max(dot(vN, L), 0.0);
  vec3 col = base * diff * mix(0.55, 0.78, uLight) + iri * F * mix(0.85, 0.55, uLight) + cC * pow(1.0 - ndv, 3.0) * 0.35 + vec3(spec) * 0.85;
  gl_FragColor = vec4(col, 1.0);
}`;
let orb = null;
function startOrb() {
  const canvas = $('#orb'); if (!canvas || orb) return;
  const fallback = () => canvas.replaceWith(el('div', { class: 'orb-fallback', 'aria-hidden': 'true' }));
  if (!window.THREE) return fallback();
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'low-power' }); } catch (e) { return fallback(); }
  const SIZE = 264; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75)); renderer.setSize(SIZE, SIZE, false);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50); camera.position.z = 6.3;
  const uniforms = { uTime: { value: 0 }, uAmp: { value: 0.07 }, uLight: { value: 0 },
    cA: { value: new THREE.Color() }, cB: { value: new THREE.Color() }, cC: { value: new THREE.Color() } };

  scene.add(blob);

  // Qalinlik va ko'rsatkich o'lchami ham R ga proporsional. Qiyaliklar har ochilishda tasodifiy (lekin chetga to'liq
  // yonbosh bo'lmasligi uchun 55°–75° oralig'ida). Ko'rsatkich tezligi Kepler qonuni bo'yicha: ω ∝ R^(−3/2).
  // Ko'rsatkich (R,0,0) nuqtada, pivot +z atrofida aylanadi → tezlik vektori +y, konus ham +y ga (urinma bo'ylab).
  const PHI = (1 + Math.sqrt(5)) / 2, RB = 1.32, AMAX = 0.2;
  const R = [RB * 1.30, RB * 1.30 * Math.pow(PHI, 0.25)];
  const rnd = (a, b) => a + Math.random() * (b - a);

                new THREE.MeshStandardMaterial({ color: 0xffd98a, metalness: 1, roughness: 0.22, emissive: 0x241a06 })];

    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.011 * r, 12, 220), mats[i]); g.add(ring);
    const pivot = new THREE.Group(); pivot.rotation.z = rnd(0, Math.PI * 2); g.add(pivot);
    const needle = new THREE.Mesh(new THREE.ConeGeometry(0.042 * r, 0.19 * r, 20), mats[i]); needle.position.set(r, 0, 0); pivot.add(needle);
    return { g, ring, pivot, r, w: W1 * Math.pow(R[0] / r, 1.5) * (i % 2 ? -1 : 1) };

  const tiltAway = new THREE.Quaternion().setFromAxisAngle(randAxis().cross(a1).normalize(), rnd(-0.44, 0.44));
  const axes = [a1, a1.clone().negate().applyQuaternion(tiltAway).normalize()];
  const spin0 = rnd(0.22, 0.42);
  orbits.forEach((o, i) => { o.axis = axes[i]; o.spin = spin0 * Math.pow(R[0] / o.r, 1.5); });
  const dq = new THREE.Quaternion();
  scene.add(new THREE.AmbientLight(0xffffff, 0.55)); const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(-2, 3, 4); scene.add(sun);

  // Kamerani sig'dirish. Halqalar istalgan holatga aylanadi, shuning uchun hamma narsa radiusi ρ = max(1.06·R₂, rb·(1+Amax))
  // bo'lgan sfera ichida. Sferaning proyeksiyasi: sin α = ρ/d (α — ko'rinish konusining yarim burchagi).
  // Shart tan α = ρ/√(d² − ρ²) ≤ T, T = tan(fov/2)/1.08 (8% zaxira) → d = ρ·√(1 + 1/T²). Bu holatga bog'liq emas.

  // Tebranish amplitudasi A — so'nuvchi prujina: A'' = −k(A − A₀) − cA', k = 60, ζ = 0.32.
